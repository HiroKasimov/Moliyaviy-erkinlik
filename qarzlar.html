<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qarzlarim</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#020208; color:#e0e0ff; font-family:'Share Tech Mono',monospace; min-height:100vh; padding:20px 16px 80px; overflow-x:hidden; }
  body::before { content:''; position:fixed; inset:0; background-image:linear-gradient(rgba(0,255,255,0.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,255,0.07) 1px,transparent 1px); background-size:40px 40px; animation:gridMove 20s linear infinite; pointer-events:none; z-index:0; }
  body::after { content:''; position:fixed; inset:0; background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.15) 2px,rgba(0,0,0,0.15) 4px); pointer-events:none; z-index:0; }
  @keyframes gridMove { 0%{background-position:0 0} 100%{background-position:40px 40px} }
  .content { position:relative; z-index:1; }
  header { text-align:center; padding:30px 0 24px; margin-bottom:24px; }
  header h1 { font-family:'Orbitron',sans-serif; font-size:22px; font-weight:900; color:#0ff; text-shadow:0 0 7px #0ff,0 0 21px #0ff,0 0 42px #0ff; letter-spacing:4px; animation:flicker 4s infinite; }
  header p { font-size:10px; color:rgba(0,255,255,0.4); letter-spacing:3px; margin-top:6px; }
  @keyframes flicker { 0%,19%,21%,23%,25%,54%,56%,100%{opacity:1} 20%,24%,55%{opacity:0.6} }
  .total-box { border-radius:16px; padding:24px 20px; margin-bottom:28px; text-align:center; position:relative; background:rgba(0,255,255,0.03); border:1px solid rgba(0,255,255,0.3); box-shadow:0 0 20px rgba(0,255,255,0.1),inset 0 0 30px rgba(0,255,255,0.03); overflow:hidden; }
  .total-box::before { content:''; position:absolute; top:-50%;left:-50%; width:200%;height:200%; background:conic-gradient(from 0deg,transparent 0deg,rgba(0,255,255,0.05) 60deg,transparent 120deg); animation:rotate 6s linear infinite; }
  @keyframes rotate { to{transform:rotate(360deg)} }
  .total-label { font-size:10px; color:rgba(0,255,255,0.5); letter-spacing:3px; text-transform:uppercase; margin-bottom:10px; position:relative; }
  .total-amount { font-family:'Orbitron',sans-serif; font-size:24px; font-weight:900; color:#ff3366; text-shadow:0 0 7px #ff3366,0 0 21px #ff3366; position:relative; }
  .section { margin-bottom:16px; border-radius:12px; overflow:hidden; position:relative; }
  .section-header { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; cursor:pointer; user-select:none; position:relative; }
  .section-title { font-family:'Orbitron',sans-serif; font-size:11px; font-weight:700; letter-spacing:2px; }
  .chevron { font-size:10px; transition:transform 0.3s; display:inline-block; margin-left:8px; }
  .chevron.open { transform:rotate(180deg); }
  .section-body { display:none; padding:12px; background:rgba(0,0,0,0.7); border-top:1px solid #333; }
  .section-body.open { display:block; }
  .debt-item { display:flex; align-items:center; justify-content:space-between; padding:12px; border-radius:8px; margin-bottom:8px; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.06); gap:10px; position:relative; overflow:hidden; }
  .debt-item::before { content:''; position:absolute; left:0;top:0;bottom:0; width:2px; background:var(--ic,#0ff); box-shadow:0 0 8px var(--ic,#0ff); }
  .debt-info { flex:1; min-width:0; padding-left:8px; }
  .debt-name { font-size:11px; color:rgba(255,255,255,0.35); margin-bottom:4px; }
  .debt-amount { font-family:'Orbitron',sans-serif; font-size:13px; font-weight:700; color:#e0e0ff; }
  .debt-date { font-size:10px; margin-top:4px; padding:2px 8px; border-radius:20px; display:inline-block; letter-spacing:1px; }
  .urgent { background:rgba(255,51,102,0.15); color:#ff3366; border:1px solid rgba(255,51,102,0.3); animation:pulse-urgent 2s infinite; }
  .soon { background:rgba(255,170,0,0.12); color:#ffaa00; border:1px solid rgba(255,170,0,0.25); }
  .later { background:rgba(100,100,150,0.12); color:#8888aa; border:1px solid rgba(100,100,150,0.2); }
  @keyframes pulse-urgent { 0%,100%{box-shadow:0 0 5px rgba(255,51,102,0.2)} 50%{box-shadow:0 0 15px rgba(255,51,102,0.5)} }
  .debt-actions { display:flex; flex-direction:column; gap:5px; flex-shrink:0; }
  .btn-edit,.btn-delete { border:1px solid; border-radius:5px; padding:5px 10px; font-size:10px; cursor:pointer; font-family:'Share Tech Mono',monospace; background:transparent; letter-spacing:1px; }
  .btn-edit { color:#ffaa00; border-color:rgba(255,170,0,0.4); }
  .btn-delete { color:#ff3366; border-color:rgba(255,51,102,0.4); }
  .add-btn { width:100%; padding:10px; background:transparent; border:1px dashed rgba(0,255,136,0.4); border-radius:8px; color:#00ff88; font-family:'Share Tech Mono',monospace; font-size:11px; cursor:pointer; margin-top:6px; letter-spacing:2px; }
  .empty { text-align:center; color:rgba(255,255,255,0.2); font-size:11px; padding:20px; letter-spacing:2px; }
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,20,0.9); z-index:100; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(4px); }
  .modal-overlay.open { display:flex; }
  .modal { background:#000814; border:1px solid rgba(0,255,255,0.3); border-radius:16px; padding:28px; width:100%; max-width:380px; box-shadow:0 0 30px rgba(0,255,255,0.1); position:relative; overflow:hidden; }
  .modal::before { content:''; position:absolute; top:0;left:0;right:0; height:1px; background:linear-gradient(90deg,transparent,#0ff,transparent); }
  .modal h3 { font-family:'Orbitron',sans-serif; font-size:13px; margin-bottom:22px; color:#0ff; text-shadow:0 0 10px #0ff; letter-spacing:2px; }
  .form-group { margin-bottom:16px; }
  .form-group label { display:block; font-size:10px; color:rgba(0,255,255,0.5); margin-bottom:7px; letter-spacing:2px; text-transform:uppercase; }
  .form-group input,.form-group select { width:100%; background:rgba(0,255,255,0.04); border:1px solid rgba(0,255,255,0.2); border-radius:8px; padding:10px 14px; color:#e0e0ff; font-family:'Share Tech Mono',monospace; font-size:13px; outline:none; }
  .form-group input:focus,.form-group select:focus { border-color:rgba(0,255,255,0.6); }
  .form-group select option { background:#000814; }
  .modal-btns { display:flex; gap:10px; margin-top:22px; }
  .btn-save { flex:1; padding:12px; background:rgba(0,255,255,0.1); border:1px solid rgba(0,255,255,0.5); border-radius:8px; color:#0ff; font-family:'Orbitron',sans-serif; font-size:11px; font-weight:700; cursor:pointer; letter-spacing:2px; }
  .btn-cancel { flex:1; padding:12px; background:transparent; border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:rgba(255,255,255,0.3); font-family:'Share Tech Mono',monospace; font-size:11px; cursor:pointer; }
  .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:rgba(0,255,136,0.15); border:1px solid rgba(0,255,136,0.4); color:#00ff88; padding:10px 24px; border-radius:30px; font-size:12px; letter-spacing:2px; z-index:200; display:none; }
  .home-link { display:inline-block; margin-top:12px; font-size:10px; letter-spacing:2px; color:rgba(0,255,255,0.65); border:1px solid rgba(0,255,255,0.3); border-radius:20px; padding:6px 16px; text-decoration:none; background:rgba(0,255,255,0.04); }
  .home-link:active { background:rgba(0,255,255,0.15); }
  .toast.show { display:block; animation:fadeInOut 2s forwards; }
  @keyframes fadeInOut { 0%{opacity:0;transform:translateX(-50%) translateY(10px)} 20%{opacity:1;transform:translateX(-50%) translateY(0)} 80%{opacity:1} 100%{opacity:0} }
  .loading { text-align:center; color:rgba(0,255,255,0.5); font-size:12px; padding:40px; letter-spacing:3px; }
</style>
</head>
<body>
<div class="content">
  <header>
    <h1>⚡ QARZLARIM</h1>
    <p>MOLIYAVIY ERKINLIK v2.0</p>
    <a href="index.html" class="home-link">🏠 Umumiy panel</a>
  </header>
  <div class="total-box">
    <div class="total-label">[ UMUMIY QARZ ]</div>
    <div class="total-amount" id="totalAmount">Yuklanmoqda...</div>
  </div>
  <div id="sectionsContainer"><div class="loading">[ FIREBASE ULANMOQDA... ]</div></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">QARZ QO'SHISH</h3>
    <div class="form-group">
      <label>Bo'lim</label>
      <select id="inputSection">
        <option value="uzum">🏦 Uzum Bank</option>
        <option value="payme">📱 Payme</option>
        <option value="yengil">💰 Yengil Kredit</option>
        <option value="paylater">💳 Pay Later</option>
        <option value="tebo">🛵 Tebo Skuter</option>
        <option value="boshqa">📦 Boshqa</option>
      </select>
    </div>
    <div class="form-group">
      <label>Nomi</label>
      <input type="text" id="inputName" placeholder="Masalan: Korzinka">
    </div>
    <div class="form-group">
      <label>Summa (so'm)</label>
      <input type="number" id="inputAmount" placeholder="100000">
    </div>
    <div class="form-group">
      <label>Muddat</label>
      <input type="date" id="inputDate">
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" id="btnCancel">BEKOR</button>
      <button class="btn-save" id="btnSave">SAQLASH</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBRAXmQ98Akn4ZX4dJZ1RUPOQ5Zvl9lR6k",
  authDomain: "moliyaviy-erkinlik.firebaseapp.com",
  databaseURL: "https://moliyaviy-erkinlik-default-rtdb.firebaseio.com",
  projectId: "moliyaviy-erkinlik",
  storageBucket: "moliyaviy-erkinlik.firebasestorage.app",
  messagingSenderId: "404181581489",
  appId: "1:404181581489:web:2945fa8e654363e4952c90"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const SECTIONS = [
  {id:'uzum',     name:'🏦 UZUM BANK',    color:'#00ff88', bg:'rgba(0,255,136,0.06)',  border:'rgba(0,255,136,0.25)'},
  {id:'payme',    name:'📱 PAYME',         color:'#ff6b00', bg:'rgba(255,107,0,0.06)',  border:'rgba(255,107,0,0.25)'},
  {id:'yengil',   name:'💰 YENGIL KREDIT', color:'#ff2255', bg:'rgba(255,34,85,0.06)',  border:'rgba(255,34,85,0.25)'},
  {id:'paylater', name:'💳 PAY LATER',      color:'#cc44ff', bg:'rgba(204,68,255,0.06)', border:'rgba(204,68,255,0.25)'},
  {id:'tebo',     name:'🛵 TEBO SKUTER',   color:'#00ccff', bg:'rgba(0,204,255,0.06)',  border:'rgba(0,204,255,0.25)'},
  {id:'boshqa',   name:'📦 BOSHQA',         color:'#ffdd00', bg:'rgba(255,221,0,0.06)',  border:'rgba(255,221,0,0.25)'}
];

let liveData = {};
let editState = null;
let addState  = null;
let openSections = {};

function fmt(n) { return Number(n).toLocaleString('ru-RU') + " so'm"; }

function urgClass(dateStr) {
  const diff = Math.ceil((new Date(dateStr) - new Date()) / 86400000);
  if (diff <= 7)  return 'urgent';
  if (diff <= 20) return 'soon';
  return 'later';
}

function fmtDate(dateStr) {
  if(!dateStr) return '';
  const p = dateStr.substring(0,10).split('-');
  const m = ['Yan','Feb','Mar','Apr','May','Iyn','Iyl','Avg','Sen','Okt','Noy','Dek'];
  return parseInt(p[2])+' '+m[parseInt(p[1])-1];
}

function grandTotal() {
  let s = 0;
  SECTIONS.forEach(sec => {
    Object.values(liveData[sec.id] || {}).forEach(d => { s += Number(d.amount||0); });
  });
  return s;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show';
  setTimeout(() => { t.className = 'toast'; }, 2000);
}

function render() {
  document.getElementById('totalAmount').textContent = fmt(grandTotal());
  const container = document.getElementById('sectionsContainer');
  container.innerHTML = '';

  SECTIONS.forEach(sec => {
    const rawDebts = liveData[sec.id] || {};
    const debts = Object.entries(rawDebts).map(([key, val]) => ({...val, _key: key}));
    const total = debts.reduce((s, d) => s + Number(d.amount||0), 0);
    const isOpen = !!openSections[sec.id];

    const section = document.createElement('div');
    section.className = 'section';
    section.style.cssText = 'border:1px solid '+sec.border+';box-shadow:0 0 12px '+sec.border.replace('0.25','0.06')+';';

    const header = document.createElement('div');
    header.className = 'section-header';
    header.style.cssText = 'background:'+sec.bg+';border-bottom:1px solid '+sec.border+';';
    header.setAttribute('data-toggle', sec.id);
    header.innerHTML =
      '<span class="section-title" style="color:'+sec.color+';text-shadow:0 0 10px '+sec.color+'">'+sec.name+'</span>'+
      '<span style="display:flex;align-items:center;gap:8px">'+
        '<span style="color:'+sec.color+';font-size:12px;font-weight:700;text-shadow:0 0 8px '+sec.color+'">'+fmt(total)+'</span>'+
        '<span class="chevron '+(isOpen?'open':'')+'" style="color:'+sec.color+'">▼</span>'+
      '</span>';

    const body = document.createElement('div');
    body.className = 'section-body'+(isOpen?' open':'');

    if (debts.length === 0) {
      body.innerHTML = '<div class="empty">[ QARZ YO\'Q ]</div>';
    } else {
      debts.forEach(d => {
        const urg = urgClass(d.date);
        const item = document.createElement('div');
        item.className = 'debt-item';
        item.style.setProperty('--ic', sec.color);

        const info = document.createElement('div');
        info.className = 'debt-info';
        info.innerHTML =
          '<div class="debt-name">'+d.name+'</div>'+
          '<div class="debt-amount">'+fmt(d.amount)+'</div>'+
          '<span class="debt-date '+urg+'">'+fmtDate(d.date)+'</span>';

        const actions = document.createElement('div');
        actions.className = 'debt-actions';

        const editBtn = document.createElement('button');
        editBtn.className = 'btn-edit';
        editBtn.textContent = '✏ EDIT';
        editBtn.setAttribute('data-action','edit');
        editBtn.setAttribute('data-sec', sec.id);
        editBtn.setAttribute('data-key', d._key);

        const delBtn = document.createElement('button');
        delBtn.className = 'btn-delete';
        delBtn.textContent = '🗑 DEL';
        delBtn.setAttribute('data-action','delete');
        delBtn.setAttribute('data-sec', sec.id);
        delBtn.setAttribute('data-key', d._key);

        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
        item.appendChild(info);
        item.appendChild(actions);
        body.appendChild(item);
      });
    }

    const addBtn = document.createElement('button');
    addBtn.className = 'add-btn';
    addBtn.textContent = "+ QARZ QO'SHISH";
    addBtn.setAttribute('data-action','add');
    addBtn.setAttribute('data-sec', sec.id);
    body.appendChild(addBtn);

    section.appendChild(header);
    section.appendChild(body);
    container.appendChild(section);
  });
}

onValue(ref(db, 'qarzlar'), (snapshot) => {
  const val = snapshot.val();
  liveData = val || {};
  render();
});

document.getElementById('sectionsContainer').addEventListener('click', function(e) {
  const t = e.target;
  const toggleEl = t.closest('[data-toggle]');
  if (toggleEl && !t.getAttribute('data-action')) {
    const sid = toggleEl.getAttribute('data-toggle');
    openSections[sid] = !openSections[sid];
    render(); return;
  }

  const action = t.getAttribute('data-action');
  if (!action) return;
  const secId = t.getAttribute('data-sec');
  const key   = t.getAttribute('data-key');

  if (action === 'delete') {
    remove(ref(db, 'qarzlar/'+secId+'/'+key));
    showToast('✅ O\'CHIRILDI');
    return;
  }

  if (action === 'edit') {
    const debt = (liveData[secId]||{})[key];
    if (!debt) return;
    editState = {secId, key};
    addState = null;
    document.getElementById('modalTitle').textContent = 'QARZNI TAHRIRLASH';
    document.getElementById('inputSection').value  = secId;
    document.getElementById('inputSection').disabled = true;
    document.getElementById('inputName').value   = debt.name;
    document.getElementById('inputAmount').value = debt.amount;
    document.getElementById('inputDate').value   = debt.date;
    document.getElementById('modalOverlay').className = 'modal-overlay open';
    return;
  }

  if (action === 'add') {
    addState = secId; editState = null;
    document.getElementById('modalTitle').textContent = "QARZ QO'SHISH";
    document.getElementById('inputSection').value = secId;
    document.getElementById('inputSection').disabled = false;
    document.getElementById('inputName').value   = '';
    document.getElementById('inputAmount').value = '';
    document.getElementById('inputDate').value   = '';
    document.getElementById('modalOverlay').className = 'modal-overlay open';
    return;
  }
});

document.getElementById('btnCancel').addEventListener('click', () => {
  document.getElementById('modalOverlay').className = 'modal-overlay';
  editState = null; addState = null;
});

document.getElementById('btnSave').addEventListener('click', () => {
  const secId  = document.getElementById('inputSection').value;
  const name   = document.getElementById('inputName').value.trim();
  const amount = parseInt(document.getElementById('inputAmount').value, 10);
  const date   = document.getElementById('inputDate').value;
  if (!name || !amount || !date) { showToast('⚠ TO\'LDIRING!'); return; }

  if (editState) {
    set(ref(db, 'qarzlar/'+editState.secId+'/'+editState.key), {name, amount, date});
    showToast('✅ SAQLANDI');
  } else {
    const newRef = push(ref(db, 'qarzlar/'+secId));
    set(newRef, {name, amount, date});
    showToast('✅ QO\'SHILDI');
  }

  document.getElementById('modalOverlay').className = 'modal-overlay';
  editState = null; addState = null;
});

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) {
    this.className = 'modal-overlay';
    editState = null; addState = null;
  }
});
</script>
</body>
</html>
