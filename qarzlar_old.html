<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBRAXmQ98Akn4ZX4dJZ1RUPOQ5Zvl9lR6k",
  authDomain: "moliyaviy-erkinlik.firebaseapp.com",
  databaseURL: "https://moliyaviy-erkinlik-default-rtdb.firebaseio.com",
  projectId: "moliyaviy-erkinlik",
  storageBucket: "moliyaviy-erkinlik.firebasestorage.app",
  messagingSenderId: "404181581489",
  appId: "1:404181581489:web:2945fa8e654363e4952c90"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const SEC_ORDER_KEY = 'order';

const DEFAULT_SECTIONS = [
  {id:'uzum',     name:'🏦 UZUM BANK',    color:'#00ff88'},
  {id:'payme',    name:'📱 PAYME',         color:'#ff6b00'},
  {id:'yengil',   name:'💰 YENGIL KREDIT', color:'#ff2255'},
  {id:'paylater', name:'💳 PAY LATER',      color:'#cc44ff'},
  {id:'tebo',     name:'🛵 TEBO SKUTER',   color:'#00ccff'},
  {id:'boshqa',   name:'📦 BOSHQA',         color:'#ffdd00'}
];

function hexToRgba(hex, alpha) {
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return 'rgba('+r+','+g+','+b+','+alpha+')';
}

let SECTIONS = [];
let secRenaming = null;

function buildSections(rawSecs) {
  return Object.entries(rawSecs)
    .map(([id, s]) => ({
      id, name: s.name, color: s.color,
      order: s[SEC_ORDER_KEY] !== undefined ? s[SEC_ORDER_KEY] : 999,
      bg: hexToRgba(s.color, 0.06), border: hexToRgba(s.color, 0.25)
    }))
    .sort((a,b) => a.order - b.order);
}

let liveData = {};
let editState = null;
let addState  = null;
let openSections = {};

function fmt(n) { return Number(n).toLocaleString('ru-RU') + " so'm"; }

function urgClass(dateStr) {
  const diff = Math.ceil((new Date(dateStr) - new Date()) / 86400000);
  if (diff <= 7)  return 'urgent';
  if (diff <= 20) return 'soon';
  return 'later';
}

function fmtDate(dateStr) {
  if(!dateStr) return '';
  const p = dateStr.substring(0,10).split('-');
  const m = ['Yan','Feb','Mar','Apr','May','Iyn','Iyl','Avg','Sen','Okt','Noy','Dek'];
  return parseInt(p[2])+' '+m[parseInt(p[1])-1];
}

function grandTotal() {
  let s = 0;
  SECTIONS.forEach(sec => {
    Object.values(liveData[sec.id] || {}).forEach(d => { s += Number(d.amount||0); });
  });
  return s;
}

const MONTH_NAMES = ['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
let monthlyHistory = {};

function monthKey(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function prevMonthKeyOf(d) { return monthKey(new Date(d.getFullYear(), d.getMonth()-1, 1)); }

function currentMonthTotal() {
  const key = monthKey(new Date());
  let s = 0;
  SECTIONS.forEach(sec => {
    Object.values(liveData[sec.id] || {}).forEach(d => {
      if (d.date && d.date.substring(0,7) === key) s += Number(d.amount||0);
    });
  });
  return s;
}

function currentMonthBySection() {
  const key = monthKey(new Date());
  return SECTIONS.map(sec => {
    let s = 0;
    Object.values(liveData[sec.id] || {}).forEach(d => {
      if (d.date && d.date.substring(0,7) === key) s += Number(d.amount||0);
    });
    return {...sec, total: s};
  });
}

function renderMonthlyBreakdown() {
  const container = document.getElementById('monthlyBreakdown');
  const bySection = currentMonthBySection().filter(sec => sec.total > 0);

  if (bySection.length === 0) {
    container.innerHTML = '<div class="monthly-empty">[ BU OY UCHUN TO\'LOV YO\'Q ]</div>';
    return;
  }

  container.innerHTML = bySection.map(sec =>
    '<div class="monthly-row">'+
      '<span class="monthly-row-name">'+sec.name+'</span>'+
      '<span class="monthly-row-amount" style="color:'+sec.color+';text-shadow:0 0 6px '+sec.color+'">'+fmt(sec.total)+'</span>'+
    '</div>'
  ).join('');
}

function renderMonthly() {
  const now = new Date();
  const curKey = monthKey(now);
  const prevKey = prevMonthKeyOf(now);
  const curTotal = currentMonthTotal();

  document.getElementById('monthlyAmount').textContent = fmt(curTotal);
  document.getElementById('monthlySub').textContent = MONTH_NAMES[now.getMonth()]+' oyi uchun muddati kelayotgan to\'lovlar';

  const trendEl = document.getElementById('monthlyTrend');
  const prevTotal = monthlyHistory[prevKey];

  if (prevTotal === undefined) {
    trendEl.textContent = "— OLDINGI OY MA'LUMOTI YO'Q";
    trendEl.className = 'monthly-trend flat';
  } else if (curTotal === prevTotal) {
    trendEl.textContent = '— O\'ZGARISHSIZ (oldingi oy: '+fmt(prevTotal)+')';
    trendEl.className = 'monthly-trend flat';
  } else if (curTotal > prevTotal) {
    const pct = prevTotal > 0 ? Math.round(((curTotal-prevTotal)/prevTotal)*100) : 100;
    trendEl.textContent = '▲ +'+pct+'% OSHDI (oldingi oy: '+fmt(prevTotal)+')';
    trendEl.className = 'monthly-trend up';
  } else {
    const pct = prevTotal > 0 ? Math.round(((prevTotal-curTotal)/prevTotal)*100) : 0;
    trendEl.textContent = '▼ -'+pct+'% TUSHDI (oldingi oy: '+fmt(prevTotal)+')';
    trendEl.className = 'monthly-trend down';
  }

  set(ref(db, 'oylikTarix/'+curKey), curTotal);
  renderMonthlyBreakdown();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show';
  setTimeout(() => { t.className = 'toast'; }, 2000);
}

function render() {
  document.getElementById('totalAmount').textContent = fmt(grandTotal());
  const container = document.getElementById('sectionsContainer');
  container.innerHTML = '';

  SECTIONS.forEach(sec => {
    const rawDebts = liveData[sec.id] || {};
    const debts = Object.entries(rawDebts).map(([key, val]) => ({...val, _key: key}));
    const total = debts.reduce((s, d) => s + Number(d.amount||0), 0);
    const isOpen = !!openSections[sec.id];

    const section = document.createElement('div');
    section.className = 'section';
    section.style.cssText = 'border:1px solid '+sec.border+';box-shadow:0 0 12px '+sec.border.replace('0.25','0.06')+';';

    const header = document.createElement('div');
    header.className = 'section-header';
    header.style.cssText = 'background:'+sec.bg+';border-bottom:1px solid '+sec.border+';';
    header.setAttribute('data-toggle', sec.id);
    header.innerHTML =
      '<span class="section-title" style="color:'+sec.color+';text-shadow:0 0 10px '+sec.color+'">'+sec.name+'</span>'+
      '<span style="display:flex;align-items:center;gap:8px">'+
        '<span style="color:'+sec.color+';font-size:12px;font-weight:700;text-shadow:0 0 8px '+sec.color+'">'+fmt(total)+'</span>'+
        '<span class="chevron '+(isOpen?'open':'')+'" style="color:'+sec.color+'">▼</span>'+
      '</span>';

    const body = document.createElement('div');
    body.className = 'section-body'+(isOpen?' open':'');

    if (debts.length === 0) {
      body.innerHTML = '<div class="empty">[ QARZ YO\'Q ]</div>';
    } else {
      debts.forEach(d => {
        const urg = urgClass(d.date);
        const item = document.createElement('div');
        item.className = 'debt-item';
        item.style.setProperty('--ic', sec.color);

        const info = document.createElement('div');
        info.className = 'debt-info';
        info.innerHTML =
          '<div class="debt-name">'+d.name+'</div>'+
          '<div class="debt-amount">'+fmt(d.amount)+'</div>'+
          '<span class="debt-date '+urg+'">'+fmtDate(d.date)+'</span>';

        const actions = document.createElement('div');
        actions.className = 'debt-actions';

        const editBtn = document.createElement('button');
        editBtn.className = 'btn-edit';
        editBtn.textContent = '✏ EDIT';
        editBtn.setAttribute('data-action','edit');
        editBtn.setAttribute('data-sec', sec.id);
        editBtn.setAttribute('data-key', d._key);

        const delBtn = document.createElement('button');
        delBtn.className = 'btn-delete';
        delBtn.textContent = '🗑 DEL';
        delBtn.setAttribute('data-action','delete');
        delBtn.setAttribute('data-sec', sec.id);
        delBtn.setAttribute('data-key', d._key);

        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
        item.appendChild(info);
        item.appendChild(actions);
        body.appendChild(item);
      });
    }

    const addBtn = document.createElement('button');
    addBtn.className = 'add-btn';
    addBtn.textContent = "+ QARZ QO'SHISH";
    addBtn.setAttribute('data-action','add');
    addBtn.setAttribute('data-sec', sec.id);
    body.appendChild(addBtn);

    section.appendChild(header);
    section.appendChild(body);
    container.appendChild(section);
  });
}

onValue(ref(db, 'qarzlar'), (snapshot) => {
  const val = snapshot.val();
  liveData = val || {};
  render();
  renderMonthly();
});

onValue(ref(db, 'oylikTarix'), (snapshot) => {
  monthlyHistory = snapshot.val() || {};
  renderMonthly();
});

// ---------- Oylik qarz tarixi (qo'lda kiritiladigan notes) ----------
let notesData = {};

document.getElementById('noteMonth').value = monthKey(new Date());
document.getElementById('noteAmount').value = '';

function renderNotes() {
  const container = document.getElementById('notesListContainer');
  const keys = Object.keys(notesData).sort(); // YYYY-MM string sort = chronological
  if (keys.length === 0) {
    container.innerHTML = '<div class="monthly-empty">[ HALI YOZUV YO\'Q ]</div>';
    return;
  }
  const maxVal = Math.max(...keys.map(k => Number(notesData[k]||0)), 1);
  let html = '';
  keys.forEach((k, i) => {
    const val = Number(notesData[k] || 0);
    const [y, m] = k.split('-');
    const label = MONTH_NAMES[parseInt(m)-1] + ' ' + y;
    const pct = Math.max(4, Math.round((val / maxVal) * 100));
    let deltaHtml = '';
    if (i > 0) {
      const prevVal = Number(notesData[keys[i-1]] || 0);
      const diff = val - prevVal;
      if (diff === 0) {
        deltaHtml = '<div class="notes-row-delta flat">— o\'zgarishsiz</div>';
      } else if (diff > 0) {
        const pctChange = prevVal > 0 ? Math.round((diff/prevVal)*100) : 100;
        deltaHtml = '<div class="notes-row-delta up">▲ +'+fmt(diff)+' (+'+pctChange+'%) oldingi oyga nisbatan</div>';
      } else {
        const pctChange = prevVal > 0 ? Math.round((Math.abs(diff)/prevVal)*100) : 0;
        deltaHtml = '<div class="notes-row-delta down">▼ -'+fmt(Math.abs(diff))+' (-'+pctChange+'%) oldingi oyga nisbatan</div>';
      }
    }
    html +=
      '<div class="notes-row">'+
        '<div class="notes-row-top"><span class="notes-row-month">'+label+'</span><span class="notes-row-amount">'+fmt(val)+'</span></div>'+
        '<div class="notes-bar-track"><div class="notes-bar-fill" style="width:'+pct+'%"></div></div>'+
        deltaHtml+
        '<div class="notes-row-actions"><button class="notes-del-btn" data-notekey="'+k+'">🗑 O\'CHIRISH</button></div>'+
      '</div>';
  });
  container.innerHTML = html;
}

onValue(ref(db, 'qarzYozuvlar'), (snapshot) => {
  notesData = snapshot.val() || {};
  renderNotes();
});

document.getElementById('btnNoteSave').addEventListener('click', () => {
  const monthInput = document.getElementById('noteMonth').value; // "YYYY-MM"
  const amountInput = document.getElementById('noteAmount').value;
  if (!monthInput) { showToast('⚠ OY TANLANG!'); return; }
  if (!amountInput || Number(amountInput) < 0) { showToast('⚠ SUMMA KIRITING!'); return; }
  set(ref(db, 'qarzYozuvlar/'+monthInput), Number(amountInput));
  document.getElementById('noteAmount').value = '';
  showToast('✅ SAQLANDI');
});

document.getElementById('notesListContainer').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-notekey]');
  if (!btn) return;
  const key = btn.getAttribute('data-notekey');
  remove(ref(db, 'qarzYozuvlar/'+key));
  showToast('✅ YOZUV O\'CHIRILDI');
});

function populateSectionSelect() {
  const sel = document.getElementById('inputSection');
  const prev = sel.value;
  sel.innerHTML = SECTIONS.map(s => '<option value="'+s.id+'">'+s.name+'</option>').join('');
  if (SECTIONS.some(s => s.id === prev)) sel.value = prev;
}

onValue(ref(db, 'qarzSections'), (snapshot) => {
  const val = snapshot.val();
  if (!val) {
    // Birinchi marta ishga tushganda eski qattiq yozilgan bo'limlarni Firebase'ga yozamiz
    const seed = {};
    DEFAULT_SECTIONS.forEach((s, i) => { seed[s.id] = {name: s.name, color: s.color, order: i}; });
    set(ref(db, 'qarzSections'), seed);
    return; // keyingi onValue chaqiruvi haqiqiy ma'lumot bilan keladi
  }
  SECTIONS = buildSections(val);
  populateSectionSelect();
  renderSecManageModal();
  render();
  renderMonthly();
});

document.getElementById('sectionsContainer').addEventListener('click', function(e) {
  const t = e.target;
  const toggleEl = t.closest('[data-toggle]');
  if (toggleEl && !t.getAttribute('data-action')) {
    const sid = toggleEl.getAttribute('data-toggle');
    openSections[sid] = !openSections[sid];
    render(); return;
  }

  const action = t.getAttribute('data-action');
  if (!action) return;
  const secId = t.getAttribute('data-sec');
  const key   = t.getAttribute('data-key');

  if (action === 'delete') {
    remove(ref(db, 'qarzlar/'+secId+'/'+key));
    showToast('✅ O\'CHIRILDI');
    return;
  }

  if (action === 'edit') {
    const debt = (liveData[secId]||{})[key];
    if (!debt) return;
    editState = {secId, key};
    addState = null;
    document.getElementById('modalTitle').textContent = 'QARZNI TAHRIRLASH';
    document.getElementById('inputSection').value  = secId;
    document.getElementById('inputSection').disabled = true;
    document.getElementById('inputName').value   = debt.name;
    document.getElementById('inputAmount').value = debt.amount;
    document.getElementById('inputDate').value   = debt.date;
    document.getElementById('modalOverlay').className = 'modal-overlay open';
    return;
  }

  if (action === 'add') {
    addState = secId; editState = null;
    document.getElementById('modalTitle').textContent = "QARZ QO'SHISH";
    document.getElementById('inputSection').value = secId;
    document.getElementById('inputSection').disabled = false;
    document.getElementById('inputName').value   = '';
    document.getElementById('inputAmount').value = '';
    document.getElementById('inputDate').value   = '';
    document.getElementById('modalOverlay').className = 'modal-overlay open';
    return;
  }
});

document.getElementById('btnCancel').addEventListener('click', () => {
  document.getElementById('modalOverlay').className = 'modal-overlay';
  editState = null; addState = null;
});

document.getElementById('btnSave').addEventListener('click', () => {
  const secId  = document.getElementById('inputSection').value;
  const name   = document.getElementById('inputName').value.trim();
  const amount = parseInt(document.getElementById('inputAmount').value, 10);
  const date   = document.getElementById('inputDate').value;
  if (!name || !amount || !date) { showToast('⚠ TO\'LDIRING!'); return; }

  if (editState) {
    set(ref(db, 'qarzlar/'+editState.secId+'/'+editState.key), {name, amount, date});
    showToast('✅ SAQLANDI');
  } else {
    const newRef = push(ref(db, 'qarzlar/'+secId));
    set(newRef, {name, amount, date});
    showToast('✅ QO\'SHILDI');
  }

  document.getElementById('modalOverlay').className = 'modal-overlay';
  editState = null; addState = null;
});

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) {
    this.className = 'modal-overlay';
    editState = null; addState = null;
  }
});

// ---------- Bo'limlarni boshqarish ----------
function renderSecManageModal() {
  const container = document.getElementById('secListContainer');
  if (!container) return;
  container.innerHTML = SECTIONS.map(sec => {
    const count = Object.keys(liveData[sec.id] || {}).length;
    const isEditing = secRenaming === sec.id;
    return (
      '<div class="sec-row'+(isEditing?' editing':'')+'" data-sid="'+sec.id+'">'+
        '<span class="sec-swatch" style="--sw:'+sec.color+'"></span>'+
        '<span class="sec-row-name">'+sec.name+'</span>'+
        '<input type="text" class="sec-name-input" value="'+sec.name.replace(/"/g,'&quot;')+'">'+
        '<span class="sec-row-count">'+count+' ta</span>'+
        (isEditing
          ? '<button class="sec-icon-btn confirm" data-secaction="save-rename">✓</button>'
          : '<button class="sec-icon-btn rename" data-secaction="rename">✏</button>'
        )+
        '<button class="sec-icon-btn del" data-secaction="delete">🗑</button>'+
      '</div>'
    );
  }).join('');
}

document.getElementById('btnManageSections').addEventListener('click', () => {
  secRenaming = null;
  renderSecManageModal();
  document.getElementById('secModalOverlay').className = 'modal-overlay open';
});

document.getElementById('btnSecClose').addEventListener('click', () => {
  secRenaming = null;
  document.getElementById('secModalOverlay').className = 'modal-overlay';
});

document.getElementById('secModalOverlay').addEventListener('click', function(e) {
  if (e.target === this) {
    secRenaming = null;
    this.className = 'modal-overlay';
  }
});

document.getElementById('secListContainer').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-secaction]');
  if (!btn) return;
  const row = btn.closest('.sec-row');
  const sid = row.getAttribute('data-sid');
  const action = btn.getAttribute('data-secaction');

  if (action === 'rename') {
    secRenaming = sid;
    renderSecManageModal();
    const input = document.querySelector('.sec-row[data-sid="'+sid+'"] .sec-name-input');
    if (input) { input.focus(); input.select(); }
    return;
  }

  if (action === 'save-rename') {
    const input = row.querySelector('.sec-name-input');
    const newName = input.value.trim();
    if (!newName) { showToast('⚠ NOM BO\'SH!'); return; }
    const sec = SECTIONS.find(s => s.id === sid);
    set(ref(db, 'qarzSections/'+sid), {name: newName, color: sec.color, order: sec.order});
    secRenaming = null;
    showToast('✅ NOM YANGILANDI');
    return;
  }

  if (action === 'delete') {
    const count = Object.keys(liveData[sid] || {}).length;
    if (count > 0) { showToast('⚠ ICHIDA QARZ BOR!'); return; }
    if (SECTIONS.length <= 1) { showToast('⚠ KAMIDA 1 TA BO\'LIM KERAK'); return; }
    remove(ref(db, 'qarzSections/'+sid));
    showToast('✅ BO\'LIM O\'CHIRILDI');
    return;
  }
});

document.getElementById('btnSecAdd').addEventListener('click', () => {
  const nameInput = document.getElementById('newSecName');
  const colorInput = document.getElementById('newSecColor');
  const name = nameInput.value.trim();
  if (!name) { showToast('⚠ NOM KIRITING!'); return; }
  const maxOrder = SECTIONS.reduce((m, s) => Math.max(m, s.order||0), -1);
  const newRef = push(ref(db, 'qarzSections'));
  set(newRef, {name, color: colorInput.value, order: maxOrder + 1});
  nameInput.value = '';
  colorInput.value = '#0ff';
  showToast('✅ BO\'LIM QO\'SHILDI');
});
</script>
</body>
</html>
